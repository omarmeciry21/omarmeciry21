<rect x="300.40" y="62" width="14.61" height="10" fill="#b07219"/>
<rect x="314.51" y="62" width="3.12" height="10" fill="#3572A5"/>
<rect x="317.13" y="62" width="1.37" height="10" fill="#663399"/>
</g>
<circle cx="27" cy="94" r="5" fill="#00B4AB"/>
